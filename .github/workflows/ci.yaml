name: ⚡️ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# PR runs share a group per branch, so a new push cancels the stale run.
# Each main commit gets its own group, so no main run is ever cancelled:
# GitHub keeps one waiting run per group and cancels it when another queues,
# and a cancelled run on main would skip that commit's Railway deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ✅ Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Yarn 3 comes from .yarnrc.yml's yarnPath, pinned by packageManager
      - name: Install deps
        id: install
        run: |
          corepack enable
          yarn install --immutable

      # Checks below run even if an earlier one fails, so one run reports every
      # failure. They still skip if setup failed
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn typecheck

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn build
